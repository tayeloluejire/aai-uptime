# AAI website heartbeat: an external GET of /healthz every 10 minutes, so the Render free instance is less likely
# to spin down (Render spins it down after 15 minutes without inbound traffic). See docs/16 §14.
#
# Install as .github/workflows/aai-keepalive.yml in a PUBLIC repository whose default branch holds it: GitHub only
# schedules workflows on the default branch, and only public repositories run standard runners without consuming
# the account's included Actions minutes. It needs no secrets and checks out no code.
#
# /healthz is the site's liveness route: it never touches the database (so Neon stays asleep), changes nothing,
# sets no cookies and returns {"status":"ok"} with Cache-Control: no-store.
name: aai-keepalive

on:
  schedule:
    - cron: "4-59/10 * * * *"   # minutes 04, 14, ... 54 (off the busy top of the hour); GitHub may still delay runs
    - cron: "33 3 * * 1"        # weekly activity marker (keep-active job below); the heartbeat also runs then
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aai-keepalive
  cancel-in-progress: false

env:
  TARGET_URL: https://aai-site-4k5m.onrender.com/healthz
  INTERVAL_MINUTES: "10"
  SLOW_SECONDS: "3"           # warm responses take about 0.5 s
  COLD_START_SECONDS: "15"    # a Render spin-up holds the request for roughly 20-60 s
  REQUEST_TIMEOUT_SECONDS: "90"
  ATTEMPTS: "3"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: GET /healthz and classify the outcome
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          # aai-keepalive check (stdlib only). Exit 1 only when every attempt failed.
          import http.client, json, os, socket, ssl, sys, time
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urlsplit

          url = os.environ["TARGET_URL"]
          interval = int(os.environ.get("INTERVAL_MINUTES", "10"))
          slow, cold = float(os.environ.get("SLOW_SECONDS", "3")), float(os.environ.get("COLD_START_SECONDS", "15"))
          timeout = float(os.environ.get("REQUEST_TIMEOUT_SECONDS", "90"))
          attempts = max(1, min(int(os.environ.get("ATTEMPTS", "3")), 5))
          backoff = float(os.environ.get("RETRY_BASE_SECONDS", "15"))
          event = os.environ.get("EVENT_NAME", "manual")
          u = urlsplit(url)
          if u.scheme not in ("https", "http") or not u.hostname:
              print(f"::error::TARGET_URL is not an http(s) URL: {url}")
              sys.exit(2)

          def get():
              """One GET. Never follows redirects; sends no cookies or credentials."""
              conn_cls = http.client.HTTPSConnection if u.scheme == "https" else http.client.HTTPConnection
              kw = {"context": ssl.create_default_context()} if u.scheme == "https" else {}
              conn = conn_cls(u.hostname, u.port or (443 if u.scheme == "https" else 80), timeout=timeout, **kw)
              t0 = time.monotonic()
              try:
                  conn.request("GET", u.path or "/", headers={"User-Agent": "aai-keepalive/1 (github-actions)",
                                                               "Accept": "application/json"})
                  r = conn.getresponse()
                  body = r.read(4096)
                  return r.status, r.getheader("Location"), body, time.monotonic() - t0, None
              except (OSError, http.client.HTTPException) as e:   # includes timeouts and TLS errors
                  return None, None, b"", time.monotonic() - t0, f"{type(e).__name__}: {e}"[:160]
              finally:
                  conn.close()

          now = datetime.now(timezone.utc)
          # latest heartbeat slot (minute 4, 14, ... 54) at or before now: a lower bound on GitHub's start delay
          slot = now.replace(second=0, microsecond=0) - timedelta(minutes=(now.minute - 4) % interval)
          start_delay = (now - slot).total_seconds()
          outcome, detail, tries, status, elapsed = "failed", "", 0, None, 0.0
          for i in range(1, attempts + 1):
              tries = i
              status, location, body, elapsed, err = get()
              if err:
                  detail = err
              elif 300 <= status < 400:
                  outcome, detail = "failed", f"unexpected redirect to {location}"
                  break                                   # a redirect means misconfiguration, not a blip
              elif status == 200:
                  try:
                      ok = json.loads(body.decode("utf-8")).get("status") == "ok"
                  except (ValueError, UnicodeDecodeError, AttributeError):
                      ok = False
                  if not ok:
                      outcome, detail = "failed", "HTTP 200 without the expected health body"
                      break
                  outcome = "cold_start" if elapsed >= cold else "slow" if elapsed >= slow else "healthy"
                  detail = ""
                  break
              else:
                  detail = f"HTTP {status}"
                  if status < 500 and status != 429:
                      break                               # a 4xx will not fix itself on retry
              if i < attempts:
                  time.sleep(backoff * i)                 # bounded: 15 s, then 30 s

          record = {"checked_at": now.isoformat(timespec="seconds"), "event": event, "url": url,
                    "outcome": outcome, "status": status, "elapsed_s": round(elapsed, 2), "attempts": tries,
                    "schedule_delay_s": round(start_delay) if event == "schedule" else None, "detail": detail or None}
          print(json.dumps(record))
          notes = []
          if outcome == "slow":
              print(f"::warning::slow response: {elapsed:.1f} s")
          if outcome == "cold_start":
              notes.append("probable Render cold start: the instance had spun down, so an earlier heartbeat missed "
                           "its window")
              print(f"::warning::probable Render cold start ({elapsed:.1f} s)")
          if event == "schedule" and start_delay > 300:
              notes.append(f"GitHub started this scheduled run at least {start_delay / 60:.0f} min after its slot")
              print(f"::warning::GitHub schedule delay: started >= {start_delay / 60:.0f} min after the slot")
          if outcome == "failed":
              print(f"::error::health check failed after {tries} attempt(s): {detail}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("| checked (UTC) | outcome | HTTP | elapsed | attempts | schedule delay |\n"
                          "|---|---|---|---|---|---|\n"
                          f"| {record['checked_at']} | {outcome} | {status} | {elapsed:.2f} s | {tries} | "
                          f"{'%d s (lower bound)' % start_delay if event == 'schedule' else 'manual run'} |\n")
                  for n in notes + ([detail] if detail else []):
                      f.write(f"\n- {n}\n")
          sys.exit(1 if outcome == "failed" else 0)
          PY

  # Public repositories have their scheduled workflows disabled after 60 days without repository activity. One small
  # commit a week (the "33 3 * * 1" schedule) counts as activity and keeps the heartbeat scheduled.
  keep-active:
    if: github.event.schedule == '33 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Weekly activity marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          content=$(printf 'last activity marker: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | base64 -w0)
          sha=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/contents/.github/keepalive-activity?ref=$BRANCH" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || true)
          body=$(python3 -c 'import json,sys; d={"message":"chore: weekly keep-alive activity marker","content":sys.argv[1],"branch":sys.argv[2]}; d.update({"sha":sys.argv[3]} if sys.argv[3] else {}); print(json.dumps(d))' "$content" "$BRANCH" "$sha")
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$REPO/contents/.github/keepalive-activity" -d "$body" > /dev/null
          echo "activity marker committed"
